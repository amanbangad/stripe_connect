<!DOCTYPE html>
<html lang="en" class="theme">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simulated onboarding · Deferred Onboarding demo</title>
    <meta name="description" content="Stand-in for Stripe-hosted onboarding used in mock mode." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .onb {
        max-width: 460px;
        margin: 48px auto;
        padding: 0 20px;
      }
      .onb__note {
        font-size: 12.5px;
        color: var(--muted);
        margin: 0 0 20px;
      }
      .onb .field {
        margin-bottom: 14px;
      }
      .onb__id {
        font-family: var(--mono);
        font-size: 12px;
        word-break: break-all;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar__brand">
        <span class="logo-mark" aria-hidden="true"></span>
        <div>
          <h1>Verify your account</h1>
          <p class="topbar__sub">Simulated Stripe-hosted onboarding (mock mode)</p>
        </div>
      </div>
    </header>

    <main class="onb">
      <div class="card">
        <div class="card__head">
          <h2>Courier identity verification</h2>
          <p class="card__hint">In live mode this is Stripe's hosted onboarding. Here it's a stand-in so you can complete the flow offline.</p>
        </div>
        <p class="onb__note">Account: <span class="onb__id" id="acct">—</span></p>

        <label class="field">
          <span>Legal name</span>
          <input type="text" value="Alex Courier" />
        </label>
        <label class="field">
          <span>Date of birth</span>
          <input type="text" value="01 / 01 / 1990" />
        </label>
        <label class="field">
          <span>SSN (last 4)</span>
          <input type="text" value="0000" />
        </label>
        <label class="field">
          <span>Bank account (routing / account)</span>
          <input type="text" value="110000000 / 000123456789" />
        </label>

        <button class="btn btn--primary btn--block" id="submit">Submit &amp; finish onboarding</button>
        <p class="form__note" id="msg"></p>
      </div>
    </main>

    <script>
      const params = new URLSearchParams(location.search);
      const account = params.get('account');
      document.getElementById('acct').textContent = account || '(missing)';

      document.getElementById('submit').addEventListener('click', async () => {
        const btn = document.getElementById('submit');
        const msg = document.getElementById('msg');
        btn.disabled = true;
        msg.textContent = 'Submitting to Stripe…';
        try {
          const res = await fetch(`/couriers/${encodeURIComponent(account)}/simulate-verified`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: '{}',
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.message || 'failed');
          msg.textContent = `Verified. Released ${data.released} held order(s). Returning to dashboard…`;
          setTimeout(() => (location.href = '/'), 1200);
        } catch (err) {
          msg.textContent = `Error: ${err.message}`;
          btn.disabled = false;
        }
      });
    </script>
  </body>
</html>
